# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). The merge does not
# rebuild: it promotes the pull request's gated digest to :main, and a v* tag
# copies main's digest to the version tags and :latest. Quay.io only.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "53 5 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.40.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/mcp-atlassian
      # The image's default transport is streamable HTTP, which answers 401
      # without per-request Atlassian credentials; stdio loads the same server
      # and tool registry with nothing to authenticate.
      boot: mcp
      boot-cmd: --transport stdio
      # Dummy settings: config loads at startup, no request reaches them.
      boot-env: |
        JIRA_URL=https://jira.invalid
        JIRA_PERSONAL_TOKEN=gate-dummy
        CONFLUENCE_URL=https://wiki.invalid
        CONFLUENCE_PERSONAL_TOKEN=gate-dummy
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
