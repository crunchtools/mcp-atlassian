[project]
name = "mcp-atlassian"
dynamic = ["version"]
description = "The Model Context Protocol (MCP) Atlassian integration is an open-source implementation that bridges Atlassian products (Jira and Confluence) with AI language models following Anthropic's MCP specification. This project enables secure, contextual AI interactions with Atlassian tools while maintaining data privacy and security. Key features include:"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "atlassian-python-api>=4.0.0",
    "requests[socks]>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.28.0",
    "mcp>=1.8.0,<2.0.0",
    "fastmcp>=3.4.10,<3.5.0",
    "fakeredis>=2.32.1,<2.35.0",
    "python-dotenv>=1.0.1",
    "markdownify>=0.11.6",
    "markdown>=3.7.0",
    "markdown-to-confluence>=0.3.4,<0.4.0",
    "pydantic>=2.10.6,<3.0",
    "trio>=0.29.0",
    "click>=8.1.7",
    "uvicorn>=0.27.1",
    "starlette>=0.49.1",
    "urllib3>=2.6.3",
    "thefuzz>=0.22.1",
    "python-dateutil>=2.9.0.post0",
    "types-python-dateutil>=2.9.0.20241206",
    "keyring>=25.6.0",
    "cachetools>=5.0.0",
    "types-cachetools>=5.5.0.20240820",
    "unidecode>=1.3.0",
    "truststore>=0.10.0",
    "tzdata>=2024.1; platform_system=='Windows'",
]
[[project.authors]]
name = "sooperset"
email = "soomiles.dev@gmail.com"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project.scripts]
mcp-atlassian = "mcp_atlassian:main"

[dependency-groups]
dev = [
    "uv>=0.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-anyio>=0.0.0",
    "pre-commit>=3.6.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
    "mcp[cli]>=1.3.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0"
]

[tool.pytest.ini_options]
markers = [
    "integration: mark test as requiring integration with real services",
    "dc_e2e: mark test as requiring DC instances (Jira DC + Confluence DC)",
    "cloud_e2e: mark test as requiring Cloud instances (Jira Cloud + Confluence Cloud)",
    "security_regression: SP5 security regression test (xfail-strict until the Phase B root fix lands; see plan)",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "ANN", "S", "BLE", "FBT", "C4", "DTZ", "T10", "EM", "ISC", "ICN"]
# The nine on the second line came from the ruff hook's `args:` in the old
# .pre-commit-config.yaml. python-sdlc reads [tool.ruff], not hook args, so
# dropping that file dropped them and `ruff check .` reported 1128 findings.
# Same rules, same intent, now in the config file (constitution XII: the
# image carries tools, the repo carries its rules).
ignore = [
  "ANN401", "EM101",
  "BLE001", "EM102", "FBT001", "FBT002", "E501", "F841", "S112", "S113", "B904",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "B017"]
"tests/fixtures/*.py" = ["E501"]
"src/mcp_atlassian/server.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = false
disallow_subclassing_any = true
warn_incomplete_stub = true
# `exclude = "^src/"` used to sit here, excluding the entire package from the
# type checker. It did not bite while mypy ran from a pre-commit hook, because
# mypy ignores `exclude` for paths passed explicitly on the command line and
# pre-commit passes the changed files. Under python-sdlc mypy is driven by
# `files` from this config, where `exclude` DOES apply -- so the pair would
# have type-checked nothing at all while reporting success. Removed.
explicit_package_bases = true

# These came from the mypy hook's `args:` in the old .pre-commit-config.yaml,
# which carried this repo's real type-checking settings and a TODO listing the
# debt behind them. python-sdlc reads [tool.mypy], not hook args, so they move
# here unchanged rather than quietly becoming strict and failing the gate.
# Each entry is existing debt to pay down, not a new allowance.
ignore_missing_imports = true
disable_error_code = [
  "index", "unreachable", "assignment", "arg-type", "return-value",
  "has-type", "no-any-return", "misc", "var-annotated", "no-untyped-def",
  "annotation-unchecked",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "atlassian.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "markdownify.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.mcp_atlassian.*"
disallow_untyped_defs = false

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent
# rather than scanning nothing and calling it a pass.
skip = ["semgrep"]

